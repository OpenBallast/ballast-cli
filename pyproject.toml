[project]
name = "openballast"
version = "0.2.3"
description = "Ballast: pull a quantized knowledge corpus (or build your own) and ground any local model — OpenAI proxy, MCP server, model profiling, and a three-arm grounding benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenBallast" }]
keywords = ["llm", "grounding", "hallucination", "mcp", "ollama", "wikidata", "rag"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "huggingface-hub>=0.23",
    "mcp>=1.9",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "zstandard>=0.22",
    "pyarrow>=15",
]

[project.urls]
Homepage = "https://openballast.org"
Documentation = "https://github.com/OpenBallast/ballast"
Artifact = "https://huggingface.co/datasets/OpenBallast/ballast-t0"

[project.scripts]
ballast = "openballast.cli:app"
openballast = "openballast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openballast"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8"]
